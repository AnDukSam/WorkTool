<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 유틸리티</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .msg-error { color: #e74c3c; background: #fdeded; }
        .msg-success { color: #27ae60; background: #eafaf1; }

        /* 공통 플레이스홀더 및 폰트 스타일 통일 */
        textarea::placeholder, input::placeholder {
            font-family: inherit;
            font-weight: 400;
            color: #9ca3af;
        }

        /* 행사내용 작성 툴 전용 스타일 */
        .event-option-container { background: #fff; padding: 18px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        .event-date-section { display: flex; flex-direction: column; gap: 12px; }
        .event-date-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .event-date-label { font-weight: bold; font-size: 14px; color: #333; display: flex; align-items: center; gap: 5px; min-width: 80px; }
        .event-date-controls { display: flex; align-items: center; gap: 6px; }
        .event-date-btn { width: 36px; height: 36px; font-size: 18px; background-color: #f8f8f8; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; color: #333; }
        .event-small-input { width: 50px; height: 36px; text-align: center; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; font-weight: bold; color: #2E7D32; }
        .event-unit-text { font-size: 14px; color: #666; min-width: 50px; }
        .event-no-price-mode { display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #eee; margin-top: 12px; padding-top: 12px; }
        .event-no-price-mode input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4CAF50; }
        .event-no-price-mode label { font-size: 14px; font-weight: bold; color: #555; cursor: pointer; }

        #event-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .event-row { background-color: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-wrap: wrap; gap: 8px; position: relative; transition: background-color 0.3s ease; }
        .event-row.completed { background-color: #fff9c4; border: 1px solid #ffe082; }

        .event-row-header { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .event-row-number { font-weight: bold; color: #4CAF50; font-size: 14px; }
        .event-checkbox-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 5px; }
        .event-check-box-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; cursor: pointer; width: fit-content; }
        .event-check-box-label input { width: 16px; height: 16px; cursor: pointer; }

        .event-controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; }
        .event-control-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; background: #fff; color: #333; }
        .event-del-btn { background-color: #ff5252; color: white; border: none; }

        .event-tool-pane select, .event-tool-pane input:not([type="checkbox"]) { height: 45px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .event-product-select, .event-product-manual { width: 100%; }
        .event-unit-select { flex: 1; min-width: 85px; }
        .event-normal-price, .event-sale-price { flex: 1; min-width: 95px; }

        .hide-normal-price .event-normal-price { display: none; }

        .event-header-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .event-header-btns button { flex: 1; height: 50px; font-size: 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #event-plus-btn { background-color: #4CAF50; color: white; }
        #event-extract-btn { background-color: #2196F3; color: white; }
        #event-reset-btn { background-color: #9e9e9e; color: white; }

        #event-result-area { margin-top: 20px; padding: 15px; background-color: #fff; border: 2px dashed #4CAF50; border-radius: 10px; white-space: pre-wrap; font-size: 14px; display: none; }
        #event-copy-btn { background-color: #333; color: white; margin-top: 15px; width: 100%; height: 55px; display: none; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }

        /* 발주 툴 공통 스타일 (돼지 / 수입고기 / 비품) - 내부 여백 0, 테두리 및 배경색 제거 */
        .pork-tool-pane, .import-tool-pane, .equipment-tool-pane {
            background-color: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .pork-tool-pane .header-setting, .import-tool-pane .header-setting, .equipment-tool-pane .header-setting { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        .pork-tool-pane .header-setting label, .import-tool-pane .header-setting label, .equipment-tool-pane .header-setting label { font-weight: bold; font-size: 15px; color: #333; }
        .pork-tool-pane .header-setting select, .import-tool-pane .header-setting select, .equipment-tool-pane .header-setting select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; outline: none; background: #f9f9f9; cursor: pointer; min-width: 120px; height: 45px; }

        .category-title { font-size: 16px; font-weight: bold; color: #2E7D32; margin: 25px 0 10px 5px; display: flex; align-items: center; }
        .category-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background-color: #4CAF50; margin-right: 8px; border-radius: 2px; }

        .tray { display: flex; flex-direction: column; gap: 10px; }
        .item-row {
            background-color: white;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e0e0e0;
        }
        .left-panel-item { font-weight: bold; color: #333; font-size: 15px; flex: 1; }

        .right-controls { display: flex; align-items: center; gap: 4px; }
        .right-controls button { width: 38px; height: 38px; background-color: #eee; border: 1px solid #ddd; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #333; }
        .right-controls button:active { background-color: #ddd; }
        .number-display { width: 45px; height: 38px; text-align: center; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #f9f9f9; font-weight: bold; color: #333; }

        .suffix-display { font-size: 13px; color: #666; width: 35px; text-align: right; margin-left: 2px; margin-right: 2px; }

        .pork-header-btns, .import-header-btns, .equipment-header-btns { display: flex; gap: 10px; margin-top: 20px; }
        .pork-header-btns button, .import-header-btns button, .equipment-header-btns button { height: 50px; font-size: 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: white; }
        #pork-clear-btn, #import-clear-btn, #equipment-clear-btn { background: #757575; flex: 0 0 100px; }
        #pork-extract-btn, #import-extract-btn, #equipment-extract-btn { background: linear-gradient(135deg, #2196F3, #1976D2); flex: 1; }

        #pork-result-area, #import-result-area, #equipment-result-area { margin-top: 25px; padding: 15px; background-color: #fff; border: 2px dashed #4CAF50; border-radius: 10px; font-size: 14px; display: none; line-height: 1.6; white-space: pre-wrap; color: #333; }
        #pork-copy-btn, #import-copy-btn, #equipment-copy-btn { background-color: #333; display: none; width: 100%; height: 55px; margin-top: 15px; border-radius: 10px; border: none; font-size: 17px; font-weight: bold; color: white; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- 모바일 상단 바 -->
    <header class="md:hidden bg-slate-900 text-white p-4 flex items-center justify-between border-b border-slate-800 sticky top-0 z-30 shrink-0">
        <div class="flex items-center gap-3">
            <button onclick="toggleMobileSidebar()" class="text-xl text-slate-300 hover:text-white focus:outline-none cursor-pointer p-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-toolbox text-blue-400"></i>
                <span>업무 유틸리티</span>
            </span>
        </div>
    </header>

    <!-- 모바일 백드롭 오버레이 -->
    <div id="mobile-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/50 z-35 hidden md:hidden"></div>

    <!-- 사이드바 메뉴 -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col shadow-lg z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
        <div class="p-6 text-xl font-bold border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-toolbox text-blue-400"></i>
                <span>업무 유틸리티</span>
            </div>
            <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button id="btn-event-promo" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium cursor-pointer">
                <i class="fa-solid fa-rectangle-ad w-5"></i>
                <span>행사내용 작성</span>
            </button>
            <button id="btn-pork-order" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer">
                <i class="fa-solid fa-piggy-bank w-5"></i>
                <span>돼지 발주</span>
            </button>
            <button id="btn-import-order" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer">
                <i class="fa-solid fa-boxes-stacked w-5"></i>
                <span>수입고기 발주</span>
            </button>
            <button id="btn-equipment-order" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer">
                <i class="fa-solid fa-boxes-packing w-5"></i>
                <span>비품 발주</span>
            </button>
        </nav>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <div class="flex-1 p-4 md:p-8 bg-gray-50 flex flex-col pb-20">

            <!-- 행사내용 작성 툴 -->
            <section id="event-promo" class="tool-content max-w-2xl bg-transparent p-0 border-0 shadow-none event-tool-pane w-full">
                <div class="event-option-container">
                    <div class="event-date-section">
                        <div class="event-date-row">
                            <span class="event-date-label">📅 시작일</span>
                            <div class="event-date-controls">
                                <button class="event-date-btn" id="event-start-minus">-</button>
                                <input type="number" id="event-start-offset" class="event-small-input" value="0">
                                <button class="event-date-btn" id="event-start-plus">+</button>
                                <span class="event-unit-text">일 후부터</span>
                            </div>
                        </div>
                        <div class="event-date-row">
                            <span class="event-date-label">⏱️ 기간</span>
                            <div class="event-date-controls">
                                <button class="event-date-btn" id="event-duration-minus">-</button>
                                <input type="number" id="event-duration-input" class="event-small-input" value="1">
                                <button class="event-date-btn" id="event-duration-plus">+</button>
                                <span class="event-unit-text">일간 진행</span>
                            </div>
                        </div>
                    </div>
                    <div class="event-no-price-mode">
                        <input type="checkbox" id="event-no-normal-price">
                        <label for="event-no-normal-price">정상가 생략 모드 (판매가만 추출)</label>
                    </div>
                </div>

                <div id="event-container"></div>

                <div class="event-header-btns">
                    <button id="event-plus-btn">품목 추가</button>
                    <button id="event-reset-btn">전체 삭제</button>
                    <button id="event-extract-btn">텍스트 추출</button>
                </div>

                <div id="event-result-area"></div>
                <button id="event-copy-btn">텍스트 복사</button>
            </section>

            <!-- 돼지 발주 툴 -->
            <section id="pork-order" class="tool-content max-w-2xl pork-tool-pane w-full" style="display: none;">
                <div class="header-setting">
                    <label>발주 지점 선택</label>
                    <select id="branchSelect">
                        <option value="2호점">2호점</option>
                        <option value="만촌점" selected>만촌점</option>
                        <option value="시지점">시지점</option>
                        <option value="온천점">온천점</option>
                        <option value="혁신점">혁신점</option>
                    </select>
                </div>

                <div class="tray" id="itemTray"></div>

                <div class="pork-header-btns">
                    <button id="pork-clear-btn">전체 삭제</button>
                    <button id="pork-extract-btn">텍스트 추출</button>
                </div>

                <div id="pork-result-area"></div>
                <button id="pork-copy-btn">텍스트 복사</button>
            </section>

            <!-- 수입고기 발주 툴 -->
            <section id="import-order" class="tool-content max-w-2xl import-tool-pane w-full" style="display: none;">
                <div class="header-setting">
                    <label>발주 지점 선택</label>
                    <select id="importBranchSelect">
                        <option value="2호점">2호점</option>
                        <option value="만촌점" selected>만촌점</option>
                        <option value="시지점">시지점</option>
                        <option value="온천점">온천점</option>
                        <option value="혁신점">혁신점</option>
                    </select>
                </div>

                <div class="tray" id="importItemTray"></div>

                <div class="import-header-btns">
                    <button id="import-clear-btn">전체 삭제</button>
                    <button id="import-extract-btn">텍스트 추출</button>
                </div>

                <div id="import-result-area"></div>
                <button id="import-copy-btn">텍스트 복사</button>
            </section>

            <!-- 비품 발주 툴 -->
            <section id="equipment-order" class="tool-content max-w-2xl equipment-tool-pane w-full" style="display: none;">
                <div class="header-setting">
                    <label>발주 지점 선택</label>
                    <select id="equipmentBranchSelect">
                        <option value="2호점">2호점</option>
                        <option value="만촌점" selected>만촌점</option>
                        <option value="시지점">시지점</option>
                        <option value="온천점">온천점</option>
                        <option value="혁신점">혁신점</option>
                    </select>
                </div>

                <div id="equipmentItemContainer"></div>

                <div class="equipment-header-btns">
                    <button id="equipment-clear-btn">전체 삭제</button>
                    <button id="equipment-extract-btn">텍스트 추출</button>
                </div>

                <div id="equipment-result-area"></div>
                <button id="equipment-copy-btn">텍스트 복사</button>
            </section>

        </div>
    </main>

    <script>
        // 탭 전환 로직
        const tabBtnEvent = document.getElementById('btn-event-promo');
        const tabBtnPork = document.getElementById('btn-pork-order');
        const tabBtnImport = document.getElementById('btn-import-order');
        const tabBtnEquipment = document.getElementById('btn-equipment-order');
        const contentEvent = document.getElementById('event-promo');
        const contentPork = document.getElementById('pork-order');
        const contentImport = document.getElementById('import-order');
        const contentEquipment = document.getElementById('equipment-order');

        function switchTab(targetTab) {
            tabBtnEvent.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer";
            tabBtnPork.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer";
            tabBtnImport.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer";
            tabBtnEquipment.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition text-slate-300 hover:bg-slate-800 hover:text-white font-medium cursor-pointer";

            contentEvent.style.display = "none";
            contentPork.style.display = "none";
            contentImport.style.display = "none";
            contentEquipment.style.display = "none";

            if (targetTab === 'event') {
                tabBtnEvent.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium cursor-pointer";
                contentEvent.style.display = "block";
                localStorage.setItem('activeWorkTool', 'event');
            } else if (targetTab === 'pork') {
                tabBtnPork.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium cursor-pointer";
                contentPork.style.display = "block";
                localStorage.setItem('activeWorkTool', 'pork');
            } else if (targetTab === 'import') {
                tabBtnImport.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium cursor-pointer";
                contentImport.style.display = "block";
                localStorage.setItem('activeWorkTool', 'import');
            } else if (targetTab === 'equipment') {
                tabBtnEquipment.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-blue-600 text-white font-medium cursor-pointer";
                contentEquipment.style.display = "block";
                localStorage.setItem('activeWorkTool', 'equipment');
            }
            if (window.innerWidth < 768) {
                toggleMobileSidebar();
            }
        }

        tabBtnEvent.onclick = () => switchTab('event');
        tabBtnPork.onclick = () => switchTab('pork');
        tabBtnImport.onclick = () => switchTab('import');
        tabBtnEquipment.onclick = () => switchTab('equipment');

        // 모바일 사이드바 토글 함수
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('mobile-backdrop');

            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        // 초기화 및 기본 데이터 세팅
        window.onload = function() {
            loadEventSavedData();
            initPorkOrderTool();
            initImportOrderTool();
            initEquipmentOrderTool();

            const activeTab = localStorage.getItem('activeWorkTool');
            if (activeTab === 'pork') {
                switchTab('pork');
            } else if (activeTab === 'import') {
                switchTab('import');
            } else if (activeTab === 'equipment') {
                switchTab('equipment');
            }
        };

        // [행사내용 작성] 로직
        const eventProductList = ["한우 곰탕", "한우 국거리", "한우 꽃등심", "한우 불고기용", "한우 육회", "한우 육회(소스 포함)", "한우 채끝등심", "🟥🟥 한우 🟥🟥", "1+ 한우 국거리", "1+ 한우 꽃등심", "1+ 한우 육회", "1+ 한우 육회(소스 포함)", "1+ 한우 채끝등심", "🟥🟥 1+ 한우 🟥🟥", "한돈 갈비", "한돈 등갈비", "한돈 등뼈", "한돈 목살", "한돈 사태", "한돈 삼겹살", "한돈 앞다리살(수육용)", "🟥🟥 한돈 🟥🟥", "대패삼겹살(국내산)", "대패삼겹살(수입산)", "대패삼겹살(칠레산)", "우삼겹(미국산)", "차돌박이(수입산)", "🟥🟥 대패류 🟥🟥", "양념 돼지갈비", "북성로 불고기", "뼈없는 닭갈비", "고추장 불고기", "양념 소불고기", "양념 LA갈비", "LA갈비식 양념 돼지갈비", "다향 훈제오리", "닭발 편육", "양념 편육", "무뼈 양념닭발", "흑마늘 오리훈제", "🟥🟥 밀키트 🟥🟥", "하림 생닭(11호)", "하림 생닭(13호)", "하림 영계", "하림 토종닭", "🟥🟥 닭 🟥🟥"];
        const eventUnitList = ['100g', '1팩', '1봉(600g 이상)', '1통', '1마리', '2마리'];

        function saveEventAllData() {
            const rows = [];
            eventContainer.querySelectorAll('.event-row').forEach(row => {
                const manualCheck = row.querySelector('.event-manual-check').checked;
                rows.push({
                    manual: manualCheck,
                    limit: row.querySelector('.event-limit-check').checked,
                    prod: manualCheck ? row.querySelector('.event-product-manual').value : row.querySelector('.event-product-select').value,
                    unit: row.querySelector('.event-unit-select').value,
                    norm: row.querySelector('.event-normal-price').value,
                    sale: row.querySelector('.event-sale-price').value
                });
            });
            const data = { startOffset: eventStartOffsetInput.value, duration: eventDurationInput.value, noNormal: eventNoNormalPriceCheck.checked, items: rows };
            localStorage.setItem('kakaoPromoData', JSON.stringify(data));
        }

        function loadEventSavedData() {
            const saved = localStorage.getItem('kakaoPromoData');
            if (!saved) { eventPlusBtn.click(); return; }
            const data = JSON.parse(saved);
            eventStartOffsetInput.value = data.startOffset;
            eventDurationInput.value = data.duration;
            eventNoNormalPriceCheck.checked = data.noNormal;
            if (data.noNormal) eventContainer.classList.add('hide-normal-price');
            data.items.forEach(item => addEventRow(item));
        }

        function getEventDateText(offset, duration) {
            const week = ['일', '월', '화', '수', '목', '금', '토'];
            const start = new Date();
            start.setDate(start.getDate() + offset);
            const end = new Date(start);
            end.setDate(end.getDate() + (duration - 1));
            const fmtDate = (d) => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${week[d.getDay()]})`;
            const fmtShortDate = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일 (${week[d.getDay()]})`;
            let range = duration === 1 ? fmtDate(start) : `${fmtDate(start)} ~ ${fmtShortDate(end)}`;
            return `🥩 정육 카톡 행사\n🗓️ 기간: ${range}`;
        }

        function updateEventNumbers() {
            eventContainer.querySelectorAll('.event-row').forEach((el, idx) => {
                el.querySelector('.event-row-number').textContent = `품목 ${idx + 1}`;

            saveEventAllData();
        }

        function addEventRow(savedItem = null) {
            const row = document.createElement('div');
            row.className = 'event-row';

            let targetItem = savedItem ? savedItem.prod : (eventProductList.find(p => p === "한우 국거리") || eventProductList[0]);
            if (!savedItem && eventContainer.lastElementChild) {
                const sel = eventContainer.lastElementChild.querySelector('.event-product-select');
                if(sel) {
                    let lastIdx = eventProductList.indexOf(sel.value);
                    let nextIdx = (lastIdx + 1) % eventProductList.length;
                    while(eventProductList[nextIdx] && eventProductList[nextIdx].includes("🟥🟥")) nextIdx = (nextIdx + 1) % eventProductList.length;
                    targetItem = eventProductList[nextIdx];
                }
            }

            row.innerHTML = `
                <div class="event-row-header"><span class="event-row-number"></span>
                    <div class="event-checkbox-group">
                        <label class="event-check-box-label"><input type="checkbox" class="event-manual-check" ${savedItem?.manual ? 'checked' : ''}> 상품명 직접 입력</label>
                        <label class="event-check-box-label"><input type="checkbox" class="event-limit-check" ${savedItem?.limit ? 'checked' : ''}> 한정판매</label>

                <input type="number" class="event-normal-price" placeholder="정상가" value="${savedItem?.norm || ''}">
                <input type="number" class="event-sale-price" placeholder="판매가" value="${savedItem?.sale || ''}">
            `;

            const renderInput = () => {
                if (manualCheck.checked) inputArea.innerHTML = `<input type="text" class="event-product-manual" placeholder="상품명 직접 입력" value="${savedItem?.manual ? savedItem.prod : ''}">`;
                else inputArea.innerHTML = `<select class="event-product-select">${eventProductList.map(p => `<option value="${p}" ${p.includes('🟥🟥') ? 'disabled' : ''} ${p === targetItem ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
            };
            manualCheck.onchange = () => { renderInput(); saveEventAllData(); };
            renderInput();

            row.addEventListener('input', () => {
                const isNoNormal = eventNoNormalPriceCheck.checked;
                const complete = isNoNormal ? row.querySelector('.event-sale-price').value !== "" : (row.querySelector('.event-normal-price').value !== "" && row.querySelector('.event-sale-price').value !== "");
                row.classList.toggle('completed', complete);
                saveEventAllData();
            });
            row.querySelector('.event-del-btn').onclick = () => { row.remove(); updateEventNumbers(); };
            row.querySelector('.event-up-btn').onclick = () => { if (row.previousElementSibling) { eventContainer.insertBefore(row, row.previousElementSibling); updateEventNumbers(); } };
            row.querySelector('.event-down-btn').onclick = () => { if (row.nextElementSibling) { eventContainer.insertBefore(row.nextElementSibling, row); updateEventNumbers(); } };

            eventContainer.appendChild(row);
            updateEventNumbers();
            if(!savedItem) row.scrollIntoView({ behavior: 'smooth', block: 'start' });

            eventResultArea.textContent = resultText.trim();

        }

            function loadState() {
                const savedBranch = localStorage.getItem(STORAGE_KEY_BRANCH);
                if (savedBranch) {
                    branchSelect.value = savedBranch;
                }
                const savedItems = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS)) || {};
                return savedItems;
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY_BRANCH, branchSelect.value);

                const itemData = {};
                const rows = document.querySelectorAll('#equipmentItemContainer .item-row');
                rows.forEach(row => {
                    const name = row.getAttribute('data-raw-name');
                    const val = parseInt(row.querySelector('.number-display').value) || 0;
                    itemData[name] = val;
                });
                localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(itemData));
            }

            function clearAllData() {
                if (confirm("입력된 모든 수량을 삭제하고 초기화하시겠습니까?")) {
                    const displays = document.querySelectorAll('#equipmentItemContainer .number-display');
                    displays.forEach(display => display.value = 0);

                    localStorage.removeItem(STORAGE_KEY_ITEMS);

                    resultArea.style.display = "none";
                    resultArea.innerText = "";
                    copyBtn.style.display = "none";
                }
            }

            const savedItemData = loadState();

            categories.forEach(cat => {
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = cat.title;
                itemContainer.appendChild(titleDiv);

                const trayDiv = document.createElement('div');
                trayDiv.className = 'tray';

                cat.items.forEach(itemObj => {
                    const unit = suffixMap[itemObj.rawName] || '개';
                    const initialVal = savedItemData[itemObj.rawName] !== undefined ? savedItemData[itemObj.rawName] : 0;

                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.setAttribute('data-raw-name', itemObj.rawName);
                    row.innerHTML = `
                        <div class="left-panel-item">${itemObj.labelHtml}</div>
                        <div class="right-controls">
                            <button class="minus-btn">-</button>
                            <input type="text" class="number-display" value="${initialVal}" readonly>
                            <button class="plus-btn">+</button>
                            <span class="suffix-display">${unit}</span>
                        </div>
                    `;

                    const minusBtn = row.querySelector('.minus-btn');
                    const plusBtn = row.querySelector('.plus-btn');
                    const display = row.querySelector('.number-display');

                    minusBtn.onclick = () => {
                        let val = parseInt(display.value);
                        if (val > 0) {
                            display.value = val - 1;
                            saveState();
                        }
                    };
                    plusBtn.onclick = () => {
                        display.value = parseInt(display.value) + 1;
                        saveState();
                    };
                    trayDiv.appendChild(row);
                });
                itemContainer.appendChild(trayDiv);
            });

            branchSelect.onchange = () => {
                saveState();
            };

            clearBtn.onclick = clearAllData;

            extractBtn.onclick = () => {
                const branch = branchSelect.value;
                let resultText = `우리축산 ${branch}입니다.\n\n`;
                let hasItem = false;
                let count = 1;

                const rows = document.querySelectorAll('#equipmentItemContainer .item-row');
                rows.forEach(row => {
                    const name = row.getAttribute('data-raw-name');
                    const val = parseInt(row.querySelector('.number-display').value);
                    const unit = row.querySelector('.suffix-display').textContent;

                    if (val > 0) {
                        resultText += `${count++}) ${name}: ${val}${unit}\n`;
                        hasItem = true;
                    }
                });

                if (!hasItem) {
                    alert("발주할 수량을 먼저 입력해주세요.");
                    return;
                }

                resultArea.innerText = resultText.trim();
                resultArea.style.display = "block";
                copyBtn.style.display = "block";
                resultArea.scrollIntoView({ behavior: 'smooth' });
            };

            copyBtn.onclick = () => {
                const textToCopy = resultArea.innerText;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        alert("복사 완료!");
                    }).catch(() => fallbackCopy(textToCopy));
                } else {
                    fallbackCopy(textToCopy);
                }
            };

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert("복사 완료!");
                } catch (err) {
                    alert("복사 실패.");
                }
                document.body.removeChild(textArea);
            }
        }

        window.onbeforeunload = () => "작성 중인 내용이 사라질 수 있습니다.";
